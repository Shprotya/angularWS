<div class="car-list-container">
    <div class="header">
        <h2>Car Inventory</h2>
        <a routerLink="/cars/new" class="add-button">Add car</a>
    </div>

    @let s = state();
    @if (s.status === 'loading') {
    <p>Loading cars...</p>
    } @else if (s.status === 'error') {
    <p> {{ s.message }}</p>
    } @else if (s.data.length === 0) {
    <p>No cars available at the moment.</p>
    } @else {
    <div class="grid">
        @for (car of s.data; track car._id) {
        <app-car-card [car]="car" />
        }
    </div>
    }
</div>
